name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java 17 tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The project currently does not declare compiler and Surefire plugins in pom.xml.
      # Pin them here so CI compiles with Java 17 and discovers JUnit 5 tests without
      # changing the shared Maven configuration.
      - name: Compile and test
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dmaven.compiler.release=17
          org.apache.maven.plugins:maven-compiler-plugin:3.13.0:compile
          org.apache.maven.plugins:maven-compiler-plugin:3.13.0:testCompile
          org.apache.maven.plugins:maven-surefire-plugin:3.2.5:test

      - name: Upload test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
